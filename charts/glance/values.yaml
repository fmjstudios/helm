# Default Helm values for adnoctem/glance.
# Reference: https://github.com/adnoctem/charts
#
# Configuration reference: https://github.com/glanceapp/glance/blob/v0.8.6/docs/configuration.md
# Native application keys and Go templates are preserved without Helm tpl evaluation.
# Optional null theme properties are omitted; request bodies and options retain null values.
# Chart-managed configuration changes roll pods on upgrade. External configuration and
# Secret changes require a rollout; projected-volume live reload is not guaranteed.

## @section Image parameters
## @param image.registry Container image registry
## @param image.repository Glance image repository
## @param image.tag Image tag; empty uses Chart.appVersion
## @param image.digest Image digest override
## @param image.pullPolicy Kubernetes image pull policy
## @param image.pullSecrets Existing image pull secret names
image:
  registry: docker.io
  repository: glanceapp/glance
  tag: ""
  digest: ""
  pullPolicy: IfNotPresent
  pullSecrets: []

## @section Name overrides
## @param nameOverride Partially override glance.fullname
nameOverride: ""
## @param fullnameOverride Fully override glance.fullname
fullnameOverride: ""

## @section Glance configuration parameters
## Native application configuration. Widget-specific examples follow this section.
glance:
  server:
    ## @param glance.server.host Listen address inside the pod
    host: 0.0.0.0
    ## @param glance.server.port HTTP listen port; also used for the container port and probes
    port: 8080
    ## @param glance.server.proxied Trust forwarded request headers; enable behind a correctly configured reverse proxy
    proxied: false
    ## @param glance.server.base-url External URL prefix, e.g. /glance; the reverse proxy must strip this prefix
    base-url: ""
    ## @param glance.server.assets-path Directory served at /assets/; must match the assets mount path
    assets-path: /app/assets

  auth:
    ## @param glance.auth.secret-key Session signing secret or Glance substitution; required when users are configured
    ## Generate with `glance secret:make`. Prefer ${secret:auth-key} and secretFiles below.
    ## The chart omits the entire auth block from generated configuration when users is empty.
    secret-key: ""
    ## @param glance.auth.users [object] Username-keyed users; each has password OR password-hash (strings)
    ## Each username accepts exactly one credential field.
    ## Example: admin: {password-hash: "${secret:admin-password-hash}"}
    users: {}

  document:
    ## @param glance.document.head HTML inserted into the head of every page
    head: ""

  branding:
    ## @param glance.branding.hide-footer Hide the application footer
    hide-footer: false
    ## @param glance.branding.custom-footer Footer HTML
    custom-footer: ""
    ## @param glance.branding.logo-text Navigation logo text
    logo-text: G
    ## @param glance.branding.logo-url Navigation logo URL; takes precedence over logo-text
    logo-url: ""
    ## @param glance.branding.favicon-url Browser favicon URL
    favicon-url: ""
    ## @param glance.branding.app-name Browser and progressive web app name
    app-name: Glance
    ## @param glance.branding.app-icon-url Progressive web app icon URL (512 by 512 PNG); empty retains upstream icon
    app-icon-url: ""
    ## @param glance.branding.app-background-color Progressive web app CSS background color; empty retains upstream color
    app-background-color: ""

  theme:
    ## @param glance.theme.light Use text colors suited to a light background
    light: false
    ## @param glance.theme.background-color Background color as space-separated HSL components
    background-color: "240 8 9"
    ## @param glance.theme.primary-color Primary HSL color
    primary-color: "43 50 70"
    ## @param glance.theme.positive-color [object, nullable] Positive HSL color; null inherits primary-color
    positive-color: null
    ## @param glance.theme.negative-color Negative HSL color
    negative-color: "0 70 70"
    ## @param glance.theme.contrast-multiplier Text contrast multiplier
    contrast-multiplier: 1
    ## @param glance.theme.text-saturation-multiplier Text saturation multiplier
    text-saturation-multiplier: 1
    ## @param glance.theme.custom-css-file External CSS URL or an /assets/ URL
    custom-css-file: ""
    ## @param glance.theme.disable-picker Disable theme switching
    disable-picker: false
    ## @param glance.theme.presets [object] Named themes, including default-dark/default-light overrides
    ## Each preset models light, background-color, primary-color, positive-color, negative-color,
    ## contrast-multiplier and text-saturation-multiplier; custom-css-file is not a preset property.
    presets: {}

  ## @param glance.pages [object, default: []] Ordered pages, each with one to three columns and one or two full columns
  ## Replace this list to configure your dashboard. Helm replaces lists rather than merging entries.
  ## The default page uses widgets which need no credentials or server-side external API calls.
  ## Each page, column or widget can instead be an {$include: filename.yml} object.
  ## Included files must contain YAML list entries (starting with a dash).
  pages:
    - name: Home
      slug: home
      width: default
      desktop-navigation-width: default
      center-vertically: false
      hide-desktop-navigation: false
      show-mobile-header: false
      head-widgets: []
      columns:
        - size: small
          widgets:
            - type: clock
              hour-format: 24h
              timezones: []
            - type: calendar
              first-day-of-week: monday
        - size: full
          widgets:
            - type: search
              search-engine: duckduckgo
              autofocus: false
              new-tab: false
              bangs: []
            - type: bookmarks
              groups:
                - title: Glance
                  links:
                    - title: Configuration
                      url: https://github.com/glanceapp/glance/blob/main/docs/configuration.md
            - type: to-do
              id: home

## Widget field reference (inactive examples, not global widget defaults).
