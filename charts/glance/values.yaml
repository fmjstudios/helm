## All widgets also accept title (string), title-url (string), hide-header (boolean),
## cache (duration string, subject to widget support), and css-class (string).
## Icons accept URLs, local /assets/ paths, si:, sh:, di:, mdi: and auto-invert prefixes.
## Page widths: default, slim, wide; slim permits at most two columns. Column sizes: small, full.
