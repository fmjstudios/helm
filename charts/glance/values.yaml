## @section Configuration file parameters
config:
  ## @param config.existingConfigMap Existing ConfigMap containing glance.yml and optional included files
  ## Mutually exclusive with existingSecret; either external source bypasses generated glance and files.
  ## Keep glance.server.port/assets-path aligned with the external file for ports/probes/mounts.
  existingConfigMap: ""
  ## @param config.existingSecret Existing Secret containing glance.yml and optional included files
  existingSecret: ""
  ## @param config.files [object] Additional filename-to-string entries for $include, mounted beside glance.yml
  ## Reserved filename: glance.yml. Strings are emitted literally, without Helm tpl evaluation.
  ## Example: set glance.pages to [{$include: home.yml}] and provide:
  ## files:
  ##   home.yml: |
  ##     - name: Home
  ##       columns:
  ##         - size: full
  ##           widgets:
  ##             - type: calendar
  files: {}

## @section Asset parameters
assets:
  ## @param assets.files [object] Filename-to-string assets (CSS, JavaScript, SVG), mounted at glance.server.assets-path
  files: {}
  ## @param assets.existingConfigMap Existing assets ConfigMap (data or binaryData); mutually exclusive with files and existingClaim
  existingConfigMap: ""
  ## @param assets.existingClaim Existing PVC containing assets; mutually exclusive with files and existingConfigMap
  existingClaim: ""
  ## @param assets.readOnly Mount assets read-only
  readOnly: true

## @section Secret substitution parameters
## @param secretFiles Existing Secrets projected together under /run/secrets for ${secret:filename}
## Each entry models name (Secret name) and items (key/path pairs); paths must be unique.
## Example:
## secretFiles:
##   - name: glance-credentials
##     items:
##       - key: signing-key
##         path: auth-key
##       - key: admin-hash
##         path: admin-password-hash
secretFiles: []

## @param extraEnvVars Kubernetes EnvVar entries for user-defined ${NAME} or ${readFileFromEnv:NAME} substitutions
## Glance does not prescribe names for these variables; application settings belong under glance.
## Use valueFrom.secretKeyRef for credentials. Environment changes require a pod restart.
extraEnvVars: []
## @param extraEnvVarsSecret Existing Secret to expose using envFrom
extraEnvVarsSecret: ""
## @param extraEnvVarsConfigMap Existing ConfigMap to expose using envFrom
extraEnvVarsConfigMap: ""

## @section Docker integration parameters
dockerSocket:
  ## @param dockerSocket.enabled Mount a node's Docker socket for docker-containers widgets
  ## Requires a Docker host, matching widget sock-path and appropriate socket permissions.
  ## This widget monitors Docker containers, not Kubernetes pods on containerd/CRI-O.
  ## Access to the Docker API grants host control even with a read-only socket mount.
  enabled: false
  ## @param dockerSocket.hostPath Docker socket path on the selected node
  hostPath: /var/run/docker.sock
  ## @param dockerSocket.mountPath Docker socket path inside Glance
  mountPath: /var/run/docker.sock

## @section ConfigMap parameters
## @param configMap.annotations [object] Annotations for chart-managed configuration and asset ConfigMaps
## @param configMap.labels [object] Labels for chart-managed configuration and asset ConfigMaps
configMap:
  annotations: {}
  labels: {}

## @section Ingress parameters
## @param ingress.enabled Create an Ingress
## @param ingress.className Ingress class name
## @param ingress.whitelist Comma-separated ingress-nginx source IP allowlist
## @param ingress.annotations [object] Ingress annotations, including controller-specific prefix rewriting
## @param ingress.tls TLS hostnames and existing certificate Secret names
## @param ingress.hosts Hosts with paths and pathType
ingress:
  enabled: false
  className: ""
  whitelist: ""
  annotations: {}
  tls: []
  hosts: []
  ## - host: glance.example.com
  ##   paths:
  ##     - path: /
  ##       pathType: Prefix

## @section Service parameters
## @param service.type Kubernetes Service type
## @param service.ports.http HTTP Service port; targets glance.server.port
## @param service.nodePort HTTP node port when using NodePort or LoadBalancer
## @param service.extraPorts Additional Service ports
## @param service.annotations [object] Service annotations
## @param service.labels [object] Service labels
## @param service.externalTrafficPolicy External traffic routing policy
## @param service.internalTrafficPolicy Internal traffic routing policy
## @param service.clusterIP Static cluster IP; empty lets Kubernetes allocate one
## @param service.loadBalancerIP Requested load balancer IP, if supported by the provider
## @param service.loadBalancerClass Load balancer implementation
## @param service.loadBalancerSourceRanges Allowed load balancer client CIDRs
## @param service.externalIPs External IP addresses
## @param service.sessionAffinity None or ClientIP
## @param service.sessionAffinityConfig [object] Session affinity settings
## @param service.ipFamilyPolicy IP family policy; empty uses the cluster default
service:
  type: ClusterIP
  ports:
    http: 8080
  nodePort: 30080
  extraPorts: []
  annotations: {}
  labels: {}
  externalTrafficPolicy: Cluster
  internalTrafficPolicy: Cluster
  clusterIP: ""
  loadBalancerIP: ""
  loadBalancerClass: ""
  loadBalancerSourceRanges: []
  externalIPs: []
  sessionAffinity: None
  sessionAffinityConfig: {}
  ipFamilyPolicy: ""

## @section Service Account parameters
## @param serviceAccount.create Create a ServiceAccount
## @param serviceAccount.automount Automount Kubernetes API credentials
## @param serviceAccount.annotations [object] ServiceAccount annotations
## @param serviceAccount.name Existing or custom ServiceAccount name
## @param serviceAccount.secrets ServiceAccount Secret references
serviceAccount:
  create: true
  automount: false
  annotations: {}
  name: ""
  secrets: []

## @section Pod settings
## @param replicaCount Deployment replicas; caches and authentication rate limits are per process
replicaCount: 1
## @param strategy [object] Deployment update strategy
strategy:
  type: RollingUpdate
## @param resources [object] Container resource requests and limits
resources: {}
## @param volumes Additional pod volumes, e.g. secret files, certificates or host statistics mounts
volumes: []
## @param volumeMounts Additional Glance container mounts
volumeMounts: []
## @param initContainers Init containers, e.g. to populate an asset volume
initContainers: []
## @param nodeSelector [object] Node labels for pod placement
nodeSelector: {}
## @param tolerations Pod tolerations
tolerations: []
## @param affinity [object] Pod affinity and anti-affinity
affinity: {}
## @param podAnnotations [object] Extra pod annotations
podAnnotations: {}
## @param podLabels [object] Extra pod labels
podLabels: {}
## @param priorityClassName Existing PriorityClass name
priorityClassName: ""

## @section Security context settings
## @param podSecurityContext [object] Pod security context; adjust for asset and Docker socket permissions
podSecurityContext: {}
## @param securityContext [object] Container security context
securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL

## @section Probe parameters
## TCP probes use the named HTTP container port so auth and base-url do not affect them.
## These check the listener; they do not verify that individual widgets can fetch data.
## @param livenessProbe.enabled Enable TCP liveness checking
## @param livenessProbe.initialDelaySeconds Initial liveness delay
## @param livenessProbe.timeoutSeconds Liveness timeout
## @param livenessProbe.periodSeconds Liveness interval
## @param livenessProbe.successThreshold Successful checks required
## @param livenessProbe.failureThreshold Failed checks before restart
livenessProbe:
  enabled: true
  initialDelaySeconds: 0
  timeoutSeconds: 1
  periodSeconds: 10
  successThreshold: 1
  failureThreshold: 3
## @param readinessProbe.enabled Enable TCP readiness checking
## @param readinessProbe.initialDelaySeconds Initial readiness delay
## @param readinessProbe.timeoutSeconds Readiness timeout
## @param readinessProbe.periodSeconds Readiness interval
## @param readinessProbe.successThreshold Successful checks required
## @param readinessProbe.failureThreshold Failed checks before removing the pod from Service endpoints
readinessProbe:
  enabled: true
  initialDelaySeconds: 0
  timeoutSeconds: 1
  periodSeconds: 10
  successThreshold: 1
  failureThreshold: 3
## @param startupProbe.enabled Enable TCP startup checking
## @param startupProbe.initialDelaySeconds Initial startup delay
## @param startupProbe.timeoutSeconds Startup timeout
## @param startupProbe.periodSeconds Startup interval
## @param startupProbe.successThreshold Successful checks required
## @param startupProbe.failureThreshold Failed checks allowed during startup
startupProbe:
  enabled: true
  initialDelaySeconds: 0
  timeoutSeconds: 1
  periodSeconds: 5
  successThreshold: 1
  failureThreshold: 30

## @section PodDisruptionBudget parameters
## @param podDisruptionBudget.enabled Create a PodDisruptionBudget
## @param podDisruptionBudget.minAvailable [object, nullable] Minimum available pods; set null when using maxUnavailable
## @param podDisruptionBudget.maxUnavailable [object, nullable] Maximum unavailable pods; mutually exclusive with minAvailable
podDisruptionBudget:
  enabled: false
  minAvailable: 1
  maxUnavailable: null
