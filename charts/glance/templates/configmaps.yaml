{{- if not (or .Values.config.existingConfigMap .Values.config.existingSecret) }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "glance.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "glance.labels" . | nindent 4 }}
    {{- with .Values.configMap.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  {{- with .Values.configMap.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
data:
  glance.yml: |
    {{- include "glance.configuration" . | nindent 4 }}
  {{- range $filename, $content := .Values.config.files }}
  {{ $filename | quote }}: |
    {{- $content | nindent 4 }}
  {{- end }}
{{- end }}
{{- if .Values.assets.files }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "glance.assetsName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "glance.labels" . | nindent 4 }}
    {{- with .Values.configMap.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  {{- with .Values.configMap.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
data:
  {{- range $filename, $content := .Values.assets.files }}
  {{ $filename | quote }}: |
    {{- $content | nindent 4 }}
  {{- end }}
{{- end }}
